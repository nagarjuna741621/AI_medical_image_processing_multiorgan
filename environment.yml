# Conda Environment Configuration
# Use this to lock dependencies cleanly to Python 3.10
name: medical_ai_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    - tensorflow>=2.10.0
    - tf-keras>=2.15.0
    - numpy>=1.22.0
    - pandas>=1.4.0
    - scikit-learn>=1.1.0
    - scikit-image>=0.19.0
    - opencv-python>=4.7.0
    - matplotlib>=3.6.0
    - seaborn>=0.12.0
    - Pillow>=9.2.0
    - streamlit>=1.24.0
    - lime>=0.2.0
    - shap>=0.41.0
    - kagglehub>=0.2.0
